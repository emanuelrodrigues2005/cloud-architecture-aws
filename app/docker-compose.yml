services:

  app:
    build: .
    container_name: mural_app
    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mural
      DB_USER: mural_user
      DB_PASSWORD: 12345678

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 12345678

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: mural_postgres

    environment:
      POSTGRES_DB: mural
      POSTGRES_USER: mural_user
      POSTGRES_PASSWORD: 12345678

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mural_user -d mural"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: mural_redis

    command: redis-server --requirepass 12345678

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "12345678", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: